name: Build Arnis Linux Desktop

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '发布到 GitHub Release (true/false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      release_tag:
        description: 'Release 标签（publish_release=true 时使用）'
        required: false
        default: 'arnis-desktop-v3.0.0'

permissions:
  contents: write
  actions: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 4
      APPIMAGE_EXTRACT_AND_RUN: 1   # 避免 CI 上 FUSE 依赖
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system deps (GTK / WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev build-essential pkg-config libglib2.0-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"

      - name: Clone Arnis source (upstream)
        run: |
          git clone --depth 1 https://github.com/louis-e/arnis.git arnis
          echo "Arnis version: $(grep '^version' arnis/Cargo.toml | head -1)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: arnis

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Fetch dependencies
        working-directory: arnis
        run: cargo fetch --locked

      - name: Build AppImage bundle
        working-directory: arnis
        run: cargo tauri build --target x86_64-unknown-linux-gnu --bundles appimage

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp arnis/target/x86_64-unknown-linux-gnu/release/arnis dist/arnis-linux
          chmod +x dist/arnis-linux
          tar -czf dist/arnis-linux.tar.gz -C dist arnis-linux
          cp arnis/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage dist/arnis-linux.AppImage
          chmod +x dist/arnis-linux.AppImage
          sha256sum dist/* | tee dist/SHA256SUMS
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: arnis-linux-desktop
          path: dist/
          retention-days: 30

      - name: Publish GitHub Release (optional)
        if: github.event.inputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "Arnis Linux Desktop $TAG" \
              --notes "Arnis v3.0.0 Linux x86_64 桌面版（AppImage + 二进制 tar.gz）"
          fi

      # 构建成功后自动串联触发 Android APK 构建（避免并行占用配额）
      - name: Chain-trigger Android APK build
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Linux build OK, triggering Android APK build..."
          gh workflow run "build-arnis-android.yml" --repo "$GITHUB_REPOSITORY" --ref main
          echo "Android build triggered."
