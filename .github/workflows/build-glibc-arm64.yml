name: Build glibc for arm64

on:
  workflow_dispatch:
  push:
    branches: [glibc-arm64]

jobs:
  build-glibc-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 arm64 交叉编译工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu libc6-dev-arm64-cross \
            linux-libc-dev-arm64-cross texinfo bison flex
          aarch64-linux-gnu-gcc --version | head -1

      - name: 下载 glibc 2.41 源码
        run: |
          wget -q https://ftp.gnu.org/gnu/glibc/glibc-2.41.tar.xz
          tar xf glibc-2.41.tar.xz

      - name: 交叉编译 glibc (arm64)
        run: |
          set -e
          mkdir -p build && cd build
          ../glibc-2.41/configure \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --prefix=/usr/aarch64-linux-gnu \
            --disable-werror \
            libc_cv_forced_unwind=yes \
            libc_cv_c_cleanup=yes
          make -j$(nproc)

      - name: 收集产物
        run: |
          set -e
          mkdir -p dist
          for f in libc.so.6 ld-linux-aarch64.so.1 ld.so.1 libm.so.6 \
                   libpthread.so.0 libdl.so.2 librt.so.1 libresolv.so.2 libc.a; do
            if [ -f "build/$f" ]; then cp "build/$f" dist/; fi
          done
          echo "=== 产物列表 ==="
          ls -la dist/
          file dist/* 2>/dev/null || true

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: glibc-arm64
          path: dist/
