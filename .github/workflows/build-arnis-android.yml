name: Build Arnis Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '发布到 GitHub Release (true/false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      release_tag:
        description: 'Release 标签（publish_release=true 时使用）'
        required: false
        default: 'arnis-android-v3.0.0'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clone Arnis source (upstream)
        run: |
          git clone --depth 1 https://github.com/louis-e/arnis.git arnis
          echo "Arnis version: $(grep '^version' arnis/Cargo.toml | head -1)"

      - name: Install Rust toolchain + Android target
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: arnis

      - name: Install Android NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      # Tauri Android 需要 lib target + rfd 在 Android 无实现，用脚本适配（桌面平台不受影响）
      - name: Adapt source for Android (lib target + rfd)
        run: bash scripts/adapt_for_android.sh

      - name: Fetch dependencies
        working-directory: arnis
        run: cargo fetch --locked

      - name: Init Android project
        working-directory: arnis
        run: cargo tauri android init

      # 兜底：Tauri CLI 移动端 build 不会自动把 frontendDist(src/gui) 打包进
      # APK assets（源码核实：inject_resources 是未调用的死代码），必须显式拷贝。
      # 双路径拷贝：assets 根（tauri.localhost 直读）和 assets/src/gui（frontendDist 前缀），
      # 无论运行时按哪种路径加载都能命中。
      - name: Copy frontend assets into Android project (fallback)
        working-directory: arnis
        run: |
          mkdir -p gen/android/app/src/main/assets
          cp -r src/gui/. gen/android/app/src/main/assets/
          mkdir -p gen/android/app/src/main/assets/src
          cp -r src/gui gen/android/app/src/main/assets/src/
          echo "=== assets 顶层内容 ==="
          ls -la gen/android/app/src/main/assets/ | head -25
          echo "=== index.html 检查（两个路径） ==="
          ls -lh gen/android/app/src/main/assets/index.html
          ls -lh gen/android/app/src/main/assets/src/gui/index.html

      - name: Build APK (aarch64)
        working-directory: arnis
        run: cargo tauri android build --apk --target aarch64

      # 构建后立即验证 APK 里确实含前端资源（避免又产出闪退包）
      - name: Verify APK contains frontend assets
        working-directory: arnis
        run: |
          set -e
          APK=$(find gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          echo "=== APK assets 内容 ==="
          unzip -l "$APK" | grep -E "assets/(index\.html|src/gui/index\.html|tauri\.conf\.json)" || true
          echo "=== index.html 校验 ==="
          if unzip -l "$APK" | grep -q "assets/index.html"; then
            echo "OK: assets/index.html 存在"
          else
            echo "FAIL: assets/index.html 缺失"
            exit 1
          fi
          echo "=== so 库校验 ==="
          unzip -l "$APK" | grep "lib/arm64-v8a/libarnis.so" || { echo "FAIL: libarnis.so 缺失"; exit 1; }
          echo "=== 校验通过 ==="

      # Arnis 的 tauri 配置在仓库根目录（非 src-tauri/），产物路径为 arnis/gen/android/...
      - name: Sign APK (debug keystore)
        working-directory: arnis
        run: |
          set -e
          APK=$(find gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "Source APK: $APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          KS="$HOME/.android/debug.keystore"
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -v -keystore "$KS" -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          fi
          "$APKSIGNER" sign --ks "$KS" --ks-pass pass:android --key-pass pass:android \
            --out arnis-android-v3.0.0.apk "$APK"
          ls -lh arnis-android-v3.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: arnis-android-apk
          path: arnis/arnis-android-v3.0.0.apk
          retention-days: 30

      - name: Publish GitHub Release (optional)
        if: github.event.inputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          APK="arnis/arnis-android-v3.0.0.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" \
              --title "Arnis Android v3.0.0" \
              --notes "Arnis - Generate real life cities in Minecraft（Android 版 APK，debug 签名）"
          fi
